
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Owner Signup - Shop FAQ Bot</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #f2f1f8;
            font-family: Arial, sans-serif;
        }

        .signup-card {
            width: 100%;
            max-width: 460px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.08);
        }

        h1 {
            color: #30264b;
            font-weight: 700;
            text-align: center;
        }

        .subtitle {
            color: #777;
            text-align: center;
            margin-bottom: 25px;
        }

        .form-label {
            font-weight: 600;
            color: #444;
        }

        .form-control {
            padding: 11px;
            border-radius: 6px;
        }

        .form-control:focus {
            border-color: #6c63a8;
            box-shadow: 0 0 0 3px rgba(108,99,168,.12);
        }

        .signup-btn {
            width: 100%;
            padding: 11px;
            background: #6c63a8;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
        }

        .signup-btn:hover {
            background: #554d8a;
            color: white;
        }

        .login-link {
            color: #6c63a8;
            font-weight: 600;
            text-decoration: none;
        }

        .login-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="signup-card">

    <h1 class="h3">Create Your Account</h1>

    <p class="subtitle">
        Sign up to manage your shop with Shop FAQ Bot.
    </p>

    {% with messages = get_flashed_messages() %}
        {% for message in messages %}
            <div class="alert alert-info">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    <form method="POST">

        <div class="mb-3">
            <label for="name" class="form-label">Full Name</label>
            <input id="name" name="name" class="form-control"
                   placeholder="Enter your full name"
                   maxlength="100" autocomplete="name" required>
        </div>

        <div class="mb-3">
            <label for="email" class="form-label">Email Address</label>
            <input id="email" name="email" type="email"
                   class="form-control"
                   placeholder="Enter your email"
                   autocomplete="email" required>
        </div>

        <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input id="password" name="password" type="password"
                   class="form-control"
                   placeholder="Create a password"
                   minlength="8" autocomplete="new-password" required>
            <small class="text-muted">Use at least 8 characters.</small>
        </div>

        <div class="mb-4">
            <label for="confirm_password" class="form-label">Confirm Password</label>
            <input id="confirm_password" name="confirm_password"
                   type="password" class="form-control"
                   placeholder="Confirm your password"
                   minlength="8" autocomplete="new-password" required>
        </div>

        <button type="submit" class="signup-btn">
            Create Account
        </button>

    </form>

    <p class="text-center mt-4 mb-0">
        Already have an account?
        <a href="{{ url_for('auth.login') }}" class="login-link">Login</a>
    </p>

</div>

</body>
</html>
