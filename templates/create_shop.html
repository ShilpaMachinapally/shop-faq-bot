
<!DOCTYPE html>
<html>
<head>
    <title>Create Shop</title>
</head>
<body>

    <h2>Create Your Shop</h2>

    <form method="POST">

        <label>Shop Name:</label>
        <input type="text" name="shop_name" required>

        <br><br>

        <button type="submit">Create Shop</button>

    </form>

    {% with messages = get_flashed_messages() %}
        {% for message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    {% endwith %}

</body>
</html>
