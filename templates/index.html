
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Shop FAQ Bot</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background-color: #6c63a8;
        }

        .navbar-brand {
            color: white;
            font-weight: bold;
        }

        .dashboard {
            max-width: 700px;
            margin: 70px auto;
            text-align: center;
            padding: 20px;
        }

        .dashboard h1 {
            color: #333;
            margin-bottom: 10px;
        }

        .dashboard p {
            color: #666;
            margin-bottom: 30px;
        }

        .btn-custom {
            background-color: #6c63a8;
            color: white;
            padding: 10px 25px;
            border-radius: 6px;
            text-decoration: none;
            margin: 8px;
            display: inline-block;
        }

        .btn-custom:hover {
            background-color: #554d8a;
            color: white;
        }
    </style>
</head>

<body>

<nav class="navbar p-3">
    <div class="container">
        <span class="navbar-brand">Shop FAQ Bot</span>
        {% if current_user.is_authenticated %}
            <a href="{{ url_for('auth.logout') }}" class="btn btn-outline-light btn-sm">
                Logout
            </a>
        {% endif %}
    </div>
</nav>

<div class="dashboard">

    <h1>Welcome to Shop FAQ Bot!</h1>

    <p>Your AI-powered shop assistant.</p>

    {% with messages = get_flashed_messages() %}
        {% for message in messages %}
            <div class="alert alert-info">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    <a href="{{ url_for('shop.create_shop') }}" class="btn-custom">
        Create Your Shop
    </a>

    <a href="{{ url_for('shop.my_shop') }}" class="btn-custom">
        My Shops
    </a>

</div>

</body>
</html>
