

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add Shop Information</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        .page-container {
            max-width: 750px;
            margin: 50px auto;
            padding: 20px;
        }

        .form-card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }

        h2 {
            color: #333;
            font-weight: 600;
            margin-bottom: 25px;
        }

        label {
            font-weight: 600;
            margin-bottom: 10px;
        }

        textarea {
            min-height: 220px;
            resize: vertical;
        }

        .form-control {
            border-radius: 6px;
            padding: 12px;
        }

        .form-control:focus {
            border-color: #6c63a8;
            box-shadow: 0 0 0 3px rgba(108,99,168,0.12);
        }

        .btn-save {
            background: #6c63a8;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 6px;
        }

        .btn-save:hover {
            background: #554d8a;
            color: white;
        }

        .back-link {
            color: #6c63a8;
            text-decoration: none;
            margin-left: 12px;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="container page-container">

    <div class="form-card">

        <h2>Add Information for {{ shop.shop_name }}</h2>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <div class="alert alert-info">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST">

            <div class="mb-4">
                <label for="content">Shop Information</label>
                <textarea
                    id="content"
                    name="content"
                    class="form-control"
                    placeholder="Enter your shop details, products, prices, delivery, return policy and FAQs..."
                    required></textarea>
            </div>

            <button type="submit" class="btn-save">
                Save Information
            </button>

            <a href="{{ url_for('shop.my_shop') }}" class="back-link">
                Back to My Shops
            </a>

        </form>

    </div>

</div>

</body>
</html>
