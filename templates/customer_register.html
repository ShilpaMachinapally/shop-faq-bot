


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Welcome - {{ shop.shop_name }}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .welcome-card {
            width: 100%;
            max-width: 480px;
            background: white;
            padding: 38px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,.2);
        }

        .shop-icon {
            font-size: 42px;
            text-align: center;
            margin-bottom: 15px;
        }

        h1 {
            color: #30264b;
            font-weight: 700;
            font-size: 27px;
            text-align: center;
        }

        .subtitle {
            color: #777;
            text-align: center;
            margin-bottom: 28px;
        }

        .form-label {
            font-weight: 600;
            color: #444;
        }

        .form-control {
            padding: 12px;
            border-radius: 9px;
            border: 1px solid #ddd;
        }

        .form-control:focus {
            border-color: #764ba2;
            box-shadow: 0 0 0 3px rgba(118,75,162,.12);
        }

        .start-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 9px;
            color: white;
            font-weight: 600;
            background: linear-gradient(135deg, #667eea, #764ba2);
            transition: .3s;
        }

        .start-btn:hover {
            transform: translateY(-2px);
            opacity: .9;
        }
    </style>
</head>

<body>

<div class="welcome-card">

    <div class="shop-icon">🛍️</div>

    <h1>Welcome to {{ shop.shop_name }}!</h1>

    <p class="subtitle">
        We're happy to help you. Enter your details to start chatting.
    </p>

    {% with messages = get_flashed_messages() %}
        {% for message in messages %}
            <div class="alert alert-warning">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    <form method="POST">

        <div class="mb-3">
            <label for="first_name" class="form-label">First Name</label>
            <input id="first_name" name="first_name"
                   class="form-control" placeholder="Enter your first name"
                   maxlength="100" autocomplete="given-name" required>
        </div>

        <div class="mb-3">
            <label for="last_name" class="form-label">Last Name</label>
            <input id="last_name" name="last_name"
                   class="form-control" placeholder="Enter your last name"
                   maxlength="100" autocomplete="family-name" required>
        </div>

        <div class="mb-3">
            <label for="email" class="form-label">Email Address</label>
            <input id="email" name="email" type="email"
                   class="form-control" placeholder="Enter your email"
                   maxlength="150" autocomplete="email" required>
        </div>

        <div class="mb-4">
            <button type="submit" class="start-btn">
                Start Chat →
            </button>
        </div>

    </form>

</div>

</body>
</html>
